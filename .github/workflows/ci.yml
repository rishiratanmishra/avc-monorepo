name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint TypeScript and JavaScript
        run: yarn lint

      - name: Verify ESLint TS/TSX coverage
        run: yarn verify:eslint-coverage

      - name: Lint CSS and design tokens
        run: yarn lint:css

      - name: Type check
        run: yarn check-types

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Format check (informational)
        run: yarn format:check
        continue-on-error: true
