<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="avc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="60%" stop-color="#147d73" />
      <stop offset="100%" stop-color="#1b75bb" />
    </linearGradient>
    <linearGradient id="paw-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#042f2e" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="120" fill="url(#avc-grad)" />

  <!-- Subtle Medical Cross Glow in Background -->
  <path d="M224 100 h64 v312 h-64 z M100 224 h312 v64 h-312 z" fill="#ffffff" opacity="0.14" />

  <!-- Central Veterinary Paw Symbol -->
  <g filter="url(#shadow)" fill="url(#paw-grad)">
    <!-- Main Center Pad -->
    <path d="M256 255 C212 255 174 290 174 340 C174 382 208 412 256 412 C304 412 338 382 338 340 C338 290 300 255 256 255 Z" />
    
    <!-- Outer Left Toe -->
    <ellipse cx="154" cy="228" rx="34" ry="46" transform="rotate(-24 154 228)" />
    
    <!-- Inner Left Toe -->
    <ellipse cx="224" cy="182" rx="33" ry="48" transform="rotate(-8 224 182)" />
    
    <!-- Inner Right Toe -->
    <ellipse cx="288" cy="182" rx="33" ry="48" transform="rotate(8 288 182)" />
    
    <!-- Outer Right Toe -->
    <ellipse cx="358" cy="228" rx="34" ry="46" transform="rotate(24 358 228)" />
  </g>

  <!-- Medical Cross on Main Pad -->
  <g fill="#0f766e">
    <rect x="247" y="324" width="18" height="46" rx="5" />
    <rect x="233" y="338" width="46" height="18" rx="5" />
  </g>
</svg>
